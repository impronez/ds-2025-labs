services:
  redis:
    image: redis:alpine
    container_name: redisValuator
    ports:
      - 6379:6379
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
    networks:
      - app-network
    
  rank-calculator: 
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    networks:
      - app-network
    
  events-logger1:
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    networks:
      - app-network
  
  events-logger2:
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    networks:
      - app-network
  
  webapp1:
    volumes:
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
    ports:
      - "5001:5001"
    env_file:
      - .env
    networks:
      - app-network

  webapp2:
    volumes:
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    depends_on:
      - redis
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
    ports:
      - "5002:5002"
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:latest
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp1
      - webapp2
    ports:
      - "8080:8080"
    networks:
      - app-network  
  
  e2e-tests:
    build:
      context: .
      dockerfile: System.Specs/Dockerfile
    depends_on:
      - webapp1
      - webapp2
      - redis
      - rabbitmq
      - nginx
    networks:
      - app-network
    shm_size: 2g
    environment:
      - BASE_URL=http://nginx:8080
    command: [ "/wait-for-it.sh", "nginx:8080", "--", "dotnet", "test", "--logger:trx" ]

volumes:
  data-protection-keys:

networks:
  app-network:
    external: true