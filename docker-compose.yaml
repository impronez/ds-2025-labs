x-redis-common: &redis-common
  build:
    context: ./infrastructure/redis/
  image: redis:alpine
  container_name: redisValuator
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD}
  volumes:
    - redis-main-data:/data
  networks:
    - app-network

services:
  redis-main:
    <<: *redis-common
    container_name: redisValuatorMain
    ports:
      - 6379:6379

  redis-ru:
    <<: *redis-common
    container_name: redisValuatorRu
    ports:
      - 6380:6379

  redis-eu:
    <<: *redis-common
    container_name: redisValuatorEu
    ports:
      - 6381:6379

  redis-asia:
    <<: *redis-common
    container_name: redisValuatorAsia
    ports:
      - 6382:6379
  
  redis-users:
    <<: *redis-common
    container_name: redisValuatorUsers
    ports:
      - 6383:6379

  rabbitmq:
    build:
      context: ./infrastructure/rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    networks:
      - app-network
    
  rank-calculator: 
    build:
      context: .
      dockerfile: RankCalculator/Dockerfile
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    env_file:
      - .env
    networks:
      - app-network
    
  events-logger1:
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    env_file:
      - .env
    networks:
      - app-network
  
  events-logger2:
    build:
      context: .
      dockerfile: EventsLogger/Dockerfile
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    env_file:
      - .env
    networks:
      - app-network
  
  webapp1:
    volumes:
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5001
    ports:
      - "5001:5001"
    env_file:
      - .env
    networks:
      - app-network

  webapp2:
    volumes:
      - data-protection-keys:/root/.aspnet/DataProtection-Keys
    build:
      context: .
      dockerfile: Valuator/Dockerfile
    depends_on:
      - redis-main
      - redis-ru
      - redis-eu
      - redis-asia
      - rabbitmq
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5002
    ports:
      - "5002:5002"
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:latest
    volumes:
      - ./infrastructure/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp1
      - webapp2
    ports:
      - "8080:8080"
    networks:
      - app-network  

volumes:
  data-protection-keys:
  redis-main-data:
  redis-ru-data:
  redis-eu-data:
  redis-asia-data:

networks:
  app-network:
    driver: bridge
