worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;

    # Логирование адреса сервера, на который отправился запрос
    # log_format proxy_log '[$time_local] $remote_addr -> $upstream_addr $request';
    # access_log /var/log/nginx/access.log proxy_log;

    # Список серверов, куда будут проксироваться запросы.
    # Подробности по ссылке:
    # https://docs.nginx.com/nginx/admin-guide/load-balancer/http-load-balancer/
    upstream signalr_backend {
        server rank-calculator:5003;
    }
    
    upstream backend {
        server webapp1:5001;
        server webapp2:5002;
    }

    # 8080 порт - точка входа для пользователей
    server {
        listen 8080;
        server_name localhost;
        
        location /rankHub {
            proxy_pass http://signalr_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
        }
    }
}
